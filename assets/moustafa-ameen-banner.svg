<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Moustafa Ameen — Software Engineer and AI Product Builder</title>
  <desc id="desc">An animated dark gradient banner with connected data nodes, moving code lines, and Moustafa Ameen's name.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"><animate attributeName="stop-color" values="#07111f;#10102b;#07111f" dur="10s" repeatCount="indefinite" /></stop>
      <stop offset="0.52" stop-color="#0b2430"><animate attributeName="stop-color" values="#0b2430;#10223d;#0b2430" dur="8s" repeatCount="indefinite" /></stop>
      <stop offset="1" stop-color="#171036"><animate attributeName="stop-color" values="#171036;#0b3340;#171036" dur="12s" repeatCount="indefinite" /></stop>
    </linearGradient>
    <radialGradient id="glowGreen"><stop offset="0" stop-color="#6ee7b7" stop-opacity="0.42" /><stop offset="1" stop-color="#6ee7b7" stop-opacity="0" /></radialGradient>
    <radialGradient id="glowPurple"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.4" /><stop offset="1" stop-color="#8b5cf6" stop-opacity="0" /></radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ee7b7" /><stop offset="0.5" stop-color="#38bdf8" /><stop offset="1" stop-color="#a78bfa" /></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1" /></pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
    <clipPath id="terminalClip"><rect x="812" y="78" width="304" height="204" rx="20" /></clipPath>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)" />
  <rect width="1200" height="360" rx="28" fill="url(#grid)" />
  <circle cx="130" cy="95" r="190" fill="url(#glowGreen)"><animate attributeName="r" values="170;215;170" dur="8s" repeatCount="indefinite" /></circle>
  <circle cx="1040" cy="280" r="215" fill="url(#glowPurple)"><animate attributeName="r" values="205;245;205" dur="10s" repeatCount="indefinite" /></circle>
  <g fill="none" stroke-linecap="round">
    <path d="M48 275 C170 190 240 300 352 224 S515 105 640 180" stroke="#38bdf8" stroke-opacity="0.26" stroke-width="2" stroke-dasharray="8 12"><animate attributeName="stroke-dashoffset" values="0;-80" dur="7s" repeatCount="indefinite" /></path>
    <path d="M82 72 C190 124 276 42 380 99 S560 126 690 70" stroke="#6ee7b7" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="5 14"><animate attributeName="stroke-dashoffset" values="0;76" dur="9s" repeatCount="indefinite" /></path>
  </g>
  <g filter="url(#softGlow)">
    <circle cx="86" cy="249" r="5" fill="#38bdf8"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" /></circle>
    <circle cx="246" cy="260" r="5" fill="#6ee7b7"><animate attributeName="opacity" values="1;0.35;1" dur="3.1s" repeatCount="indefinite" /></circle>
    <circle cx="397" cy="195" r="5" fill="#a78bfa"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" /></circle>
    <circle cx="596" cy="169" r="5" fill="#38bdf8"><animate attributeName="opacity" values="1;0.4;1" dur="3.6s" repeatCount="indefinite" /></circle>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="78" y="116" fill="#94a3b8" font-size="18" font-weight="600" letter-spacing="4">SOFTWARE ENGINEER  ·  AI PRODUCT BUILDER</text>
    <text x="74" y="185" fill="#f8fafc" font-size="58" font-weight="800" letter-spacing="-1.5">MOUSTAFA AMEEN</text>
    <rect x="78" y="207" width="590" height="4" rx="2" fill="url(#accent)"><animate attributeName="width" values="80;590;590" keyTimes="0;0.55;1" dur="3.5s" repeatCount="indefinite" /></rect>
    <text x="78" y="250" fill="#cbd5e1" font-size="23" font-weight="500">Building reliable systems for real decisions.</text>
    <text x="78" y="294" fill="#6ee7b7" font-size="16" font-weight="700" letter-spacing="2.5">JAVA  ·  PYTHON  ·  TYPESCRIPT  ·  DATA  ·  PRODUCT</text>
  </g>
  <g clip-path="url(#terminalClip)">
    <rect x="812" y="78" width="304" height="204" rx="20" fill="#050b14" fill-opacity="0.82" stroke="#64748b" stroke-opacity="0.3" />
    <rect x="812" y="78" width="304" height="38" fill="#111827" fill-opacity="0.88" />
    <circle cx="837" cy="97" r="5" fill="#fb7185" /><circle cx="856" cy="97" r="5" fill="#fbbf24" /><circle cx="875" cy="97" r="5" fill="#6ee7b7" />
    <text x="1089" y="102" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="11">build.ts</text>
    <g font-family="Consolas,Courier New,monospace" font-size="15">
      <text x="836" y="148" fill="#a78bfa">const</text><text x="882" y="148" fill="#f8fafc">idea</text><text x="918" y="148" fill="#94a3b8">=</text><text x="936" y="148" fill="#6ee7b7">understand</text><text x="1030" y="148" fill="#94a3b8">();</text>
      <text x="836" y="180" fill="#38bdf8">model</text><text x="878" y="180" fill="#94a3b8">.</text><text x="887" y="180" fill="#f8fafc">build</text><text x="927" y="180" fill="#94a3b8">(</text><text x="937" y="180" fill="#fbbf24">domain</text><text x="988" y="180" fill="#94a3b8">);</text>
      <text x="836" y="212" fill="#38bdf8">system</text><text x="886" y="212" fill="#94a3b8">.</text><text x="895" y="212" fill="#f8fafc">test</text><text x="927" y="212" fill="#94a3b8">(</text><text x="937" y="212" fill="#fb7185">failureModes</text><text x="1043" y="212" fill="#94a3b8">);</text>
      <text x="836" y="244" fill="#a78bfa">return</text><text x="891" y="244" fill="#6ee7b7">decision</text><text x="959" y="244" fill="#94a3b8">;</text>
    </g>
    <rect x="836" y="259" width="236" height="3" rx="1.5" fill="#1e293b" />
    <rect x="836" y="259" width="70" height="3" rx="1.5" fill="url(#accent)"><animate attributeName="x" values="836;1002;836" dur="4.5s" repeatCount="indefinite" /><animate attributeName="width" values="70;42;70" dur="4.5s" repeatCount="indefinite" /></rect>
  </g>
  <circle r="4" fill="#6ee7b7" filter="url(#softGlow)"><animateMotion dur="7s" repeatCount="indefinite" path="M48 275 C170 190 240 300 352 224 S515 105 640 180" /></circle>
  <circle r="4" fill="#a78bfa" filter="url(#softGlow)"><animateMotion dur="9s" repeatCount="indefinite" path="M82 72 C190 124 276 42 380 99 S560 126 690 70" /></circle>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="url(#accent)" stroke-opacity="0.3" stroke-width="2" />
</svg>
